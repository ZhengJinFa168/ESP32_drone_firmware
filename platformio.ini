; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; VS Code's Build/Test buttons use this env. Unit tests: `pio test -e native`
default_envs = nodemcu-32s

; Firmware + hardware (integration) tests on the real board
[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Same C++ standard as the native unit tests, so tested code compiles identically
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Unit tests use mocks and run on the host only (native env)
test_ignore = unit/*
lib_deps = 
	sparkfun/SparkFun BMI270 Arduino Library@^1.0.3
	mathieucarbou/ESPAsyncWebServer @ ^3.3.6
; ESPAsyncWebServer makes the LDF pull in Arduino's synchronous WebServer, which
; fails to find WiFiServer.h in test builds. It is not used, so exclude it.
lib_ignore = WebServer

[env:native]
platform = native
test_framework = unity
test_ignore = integration/*
lib_deps = 
	throwtheswitch/Unity
	sparkfun/SparkFun BMI270 Arduino Library@^1.0.3
build_flags = 
	-I src
	-I src/core
	-I test/unit/mocks
	-DUNIT_TEST
	-std=gnu++17
build_src_filter = -<*>
